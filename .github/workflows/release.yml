name: Release

# Publishes a GitHub Release with WordBuddy-vX.Y.Z.apk attached when:
#   - the VERSION file changes on main (e.g. 3.1.0 -> 3.2.0), or
#   - you push a tag like v3.2.0, or
#   - you run it by hand (Actions > Release > Run workflow).
# A version that is already released is skipped.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \n\r' < VERSION)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must look like 3.1.0"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'

      - name: Signing key
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests + signed release APK
        if: steps.ver.outputs.skip != 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.version }}" -PappVersionCode="${{ steps.ver.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "WordBuddy-v${{ steps.ver.outputs.version }}.apk"

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES="$(awk -v v="## v$VERSION" '$0==v{f=1;next} /^## v/{f=0} f' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="Word Buddy v$VERSION"
          gh release create "v$VERSION" "WordBuddy-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Word Buddy v$VERSION" \
            --notes "$NOTES"
