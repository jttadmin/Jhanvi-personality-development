name: Build APK

# Every push to main: run tests and build a test APK (download it from the run's Artifacts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the permanent signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets yet - this APK uses a throwaway key and won't update an installed release."
          fi

      - name: Unit tests + build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PappVersionName="dev-${GITHUB_SHA::7}" -PappVersionCode="${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: word-buddy-apk
          path: app/build/outputs/apk/release/*.apk
